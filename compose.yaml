name: flash-sale

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flash_sale}
      POSTGRES_USER: ${POSTGRES_USER:-flash_sale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flash_sale_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${REDIS_INSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data

  api:
    build:
      context: ./apps/api
    environment:
      API_PORT: 5000
      API_KEEP_ALIVE_TIMEOUT_MS: ${API_KEEP_ALIVE_TIMEOUT_MS:-65000}
      API_HEADERS_TIMEOUT_MS: ${API_HEADERS_TIMEOUT_MS:-66000}
      API_REQUEST_TIMEOUT_MS: ${API_REQUEST_TIMEOUT_MS:-15000}
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-1000}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://redis:6379
      POSTGRES_DB: ${POSTGRES_DB:-flash_sale}
      POSTGRES_USER: ${POSTGRES_USER:-flash_sale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flash_sale_local}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-2}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-3000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      DATABASE_MAX_LIFETIME_SECONDS: ${DATABASE_MAX_LIFETIME_SECONDS:-300}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-replace_with_a_long_random_secret}
      ADMIN_TOKEN_EXPIRES_IN: ${ADMIN_TOKEN_EXPIRES_IN:-1h}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-3000}
      REDIS_RECONNECT_MAX_DELAY_MS: ${REDIS_RECONNECT_MAX_DELAY_MS:-2000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    expose:
      - "5000"
    deploy:
      replicas: ${API_REPLICAS:-3}

  ui:
    build:
      context: ./apps/ui
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:80"
      - "${API_PORT:-5000}:5000"

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
