name: flash-sale-production

services:
  api:
    build:
      context: ./apps/api
    environment:
      API_PORT: 5000
      API_KEEP_ALIVE_TIMEOUT_MS: ${API_KEEP_ALIVE_TIMEOUT_MS:-65000}
      API_HEADERS_TIMEOUT_MS: ${API_HEADERS_TIMEOUT_MS:-66000}
      API_REQUEST_TIMEOUT_MS: ${API_REQUEST_TIMEOUT_MS:-15000}
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-1000}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a highly available PostgreSQL endpoint}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-2}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-3000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      DATABASE_MAX_LIFETIME_SECONDS: ${DATABASE_MAX_LIFETIME_SECONDS:-300}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to a highly available Redis endpoint}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-3000}
      REDIS_RECONNECT_MAX_DELAY_MS: ${REDIS_RECONNECT_MAX_DELAY_MS:-2000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET}
      ADMIN_TOKEN_EXPIRES_IN: ${ADMIN_TOKEN_EXPIRES_IN:-1h}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      replicas: ${API_REPLICAS:-3}
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 2s
        max_attempts: 5
        window: 60s
      resources:
        limits:
          cpus: ${API_CPU_LIMIT:-1.0}
          memory: ${API_MEMORY_LIMIT:-512M}

  ui:
    build:
      context: ./apps/ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_PORT:-3000}:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${UI_CPU_LIMIT:-0.5}
          memory: ${UI_MEMORY_LIMIT:-128M}
